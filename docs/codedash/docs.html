        [data-theme="light"] {

            --text: #1a1a1a; --text-light: #444444; --text-muted: #888888;
            --border: rgba(0,0,0,0.08); --success: #10b981;

            --nav-bg: rgba(255,255,255,0.92); --nav-bg-scrolled: rgba(255,255,255,0.98);
            --nav-mobile-bg: rgba(255,255,255,0.98); --nav-shadow: 0 4px 30px rgba(0,0,0,0.08);

        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-thumb-hover); }

        /* === Navbar === */
        .navbar {

            padding: 0 3rem; height: 72px;
            display: flex; align-items: center; justify-content: space-between;

        .navbar.scrolled { background: var(--nav-bg-scrolled); box-shadow: var(--nav-shadow); }
        .navbar .logo {

            font-size: 1.4rem; font-weight: 800; color: var(--nav-text); letter-spacing: -0.5px; text-decoration: none;

        .navbar .logo .logo-icon {

            background: #9ca3af;
            border-radius: 10px; display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem; font-weight: 700; color: #0d1117;

        .navbar .nav-links { display: flex; gap: 2.5rem; list-style: none; align-items: center; }
        .navbar .nav-links a {
            text-decoration: none; color: var(--text-light);
            font-weight: 500; font-size: 0.9rem;
            transition: color 0.2s; position: relative;
        }
        .navbar .nav-links a::after {
            content: ''; position: absolute; bottom: -4px; left: 0; width: 0; height: 2px;
            background: var(--primary); transition: width 0.3s;
        }
        .navbar .nav-links a:hover { color: var(--nav-link-hover); }
        .navbar .nav-links a:hover::after { width: 100%; }
        .navbar .nav-links a.active { color: var(--nav-link-hover); }
        .navbar .nav-links a.active::after { width: 100%; }
        .navbar .hamburger {
            display: none; flex-direction: column; gap: 5px;
            background: none; border: none; cursor: pointer; padding: 4px;
        }
        .navbar .hamburger span { width: 24px; height: 2px; background: white; border-radius: 2px; transition: all 0.3s; }
        .navbar .hamburger.active span:nth-child(1) { transform: rotate(45deg) translate(5px,5px); }
        .navbar .hamburger.active span:nth-child(2) { opacity: 0; }
        .navbar .hamburger.active span:nth-child(3) { transform: rotate(-45deg) translate(5px,-5px); }
        .theme-toggle {
            background: none; border: none; font-size: 1.3rem; cursor: pointer;
            padding: 0.3rem; line-height: 1; border-radius: 50%; width: 36px; height: 36px;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.3s; color: var(--text-light);
        }
        .theme-toggle:hover { background: rgba(255,255,255,0.15); color: var(--primary-light); }
        .nav-links .gh-btn {
            background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3);
            color: var(--primary-light); padding: 0.4rem 1rem; border-radius: 20px;
            font-size: 0.85rem; font-weight: 600; transition: all 0.2s;
        }
        .nav-links .gh-btn:hover { background: rgba(255,255,255,0.25); border-color: var(--primary); color: var(--nav-link-hover); }
        .nav-links .gh-btn::after { display: none; }

        /* === Docs Layout === */
        .docs-wrapper {
            display: flex; min-height: calc(100vh - 72px);
            max-width: 1400px; margin: 0 auto;
        }

        /* === Left Sidebar === */
        .docs-sidebar {
            width: 260px; flex-shrink: 0;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border);
            padding: 1.5rem 0; overflow-y: auto;
            position: sticky; top: 72px; height: calc(100vh - 72px);
        }
        .docs-sidebar .sidebar-title {
            padding: 0 1.2rem 1rem; font-size: 0.7rem;
            text-transform: uppercase; letter-spacing: 2px;
            color: var(--text-muted); font-weight: 700;
        }
        .docs-sidebar .art-list { list-style: none; }
        .docs-sidebar .art-list li { padding: 0; }
        .docs-sidebar .art-list a {
            display: flex; align-items: center; gap: 0.6rem;
            padding: 0.65rem 1.2rem; color: var(--text-light);
            text-decoration: none; font-size: 0.88rem; font-weight: 500;
            transition: all 0.2s; border-left: 3px solid transparent;
        }
        .docs-sidebar .art-list a:hover {
            background: var(--sidebar-hover); color: var(--text);
        }
        .docs-sidebar .art-list a.active {
            background: var(--sidebar-active); color: var(--text);
            border-left-color: var(--primary);
        }
        .docs-sidebar .art-list a .art-icon { font-size: 1rem; flex-shrink: 0; }

        /* === Main Content === */
        .docs-main {
            flex: 1; min-width: 0;
            display: flex; gap: 2rem;
            padding: 2.5rem 2rem;
        }
        .docs-content {
            flex: 1; min-width: 0; max-width: 800px;
        }
        .docs-content .art-title {
            font-size: 2.2rem; font-weight: 800;
            margin-bottom: 0.5rem; letter-spacing: -0.5px;
            color: var(--text);
        }
        .docs-content .art-desc {
            color: var(--text-muted); font-size: 1rem;
            margin-bottom: 2rem; padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
        }
        .docs-content section { margin-bottom: 2.5rem; }
        .docs-content h2 {
            font-size: 1.5rem; font-weight: 700; margin-bottom: 1rem;
            color: var(--text); padding-bottom: 0.3rem;
            border-bottom: 1px solid var(--border);
        }
        .docs-content h3 {
            font-size: 1.15rem; font-weight: 600; margin: 1.5rem 0 0.8rem;
            color: var(--text-light);
        }
        .docs-content p { color: var(--text-light); margin-bottom: 1rem; font-size: 0.95rem; }
        .docs-content ul, .docs-content ol {
            color: var(--text-light); margin: 0.5rem 0 1rem 1.5rem; font-size: 0.95rem;
        }
        .docs-content li { margin-bottom: 0.4rem; }
        .docs-content code {
            background: var(--code-bg); padding: 0.15rem 0.5rem;
            border-radius: 4px; font-size: 0.85rem; color: var(--primary-light);
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
        }
        [data-theme="light"] .docs-content code {
            color: #333;
            background: rgba(0,0,0,0.06);
        }
        .docs-content pre {
            background: var(--code-bg); padding: 1.2rem; border-radius: var(--radius-sm);
            border: 1px solid var(--border); overflow-x: auto; margin: 1rem 0;
        }
        .docs-content pre code { background: none; padding: 0; color: var(--text-light); }
        .docs-content .highlight-box {
            background: var(--sidebar-bg); border: 1px solid var(--card-border);
            border-left: 3px solid var(--primary); border-radius: var(--radius-sm);
            padding: 1rem 1.2rem; margin: 1rem 0;
        }
        .docs-content .highlight-box .label {
            font-size: 0.75rem; font-weight: 700; text-transform: uppercase;
            color: var(--primary-light); margin-bottom: 0.3rem;
        }
        .docs-content .highlight-box p { margin-bottom: 0; }

        /* === Right TOC === */
        .docs-toc {
            width: 200px; flex-shrink: 0;
            position: sticky; top: calc(72px + 2.5rem);
            height: fit-content; max-height: calc(100vh - 72px - 5rem);
            overflow-y: auto;
        }
        .docs-toc .toc-title {
            font-size: 0.7rem; text-transform: uppercase; letter-spacing: 2px;
            color: var(--text-muted); font-weight: 700; margin-bottom: 1rem;
        }
        .docs-toc .toc-list { list-style: none; border-left: 1px solid var(--border); }
        .docs-toc .toc-list a {
            display: block; padding: 0.35rem 1rem; font-size: 0.82rem;
            color: var(--text-muted); text-decoration: none;
            border-left: 2px solid transparent; transition: all 0.2s;
        }
        .docs-toc .toc-list a:hover {
            color: var(--text); border-left-color: var(--text-muted);
        }
        .docs-toc .toc-list a.active {
            color: var(--primary-light); border-left-color: var(--primary);
        }
        .docs-toc .toc-list a.h3 {
            padding-left: 1.8rem; font-size: 0.78rem;
        }

        /* === Footer === */
        .docs-footer {
            text-align: center; padding: 2rem;
            color: var(--text-muted); font-size: 0.85rem;
            border-top: 1px solid var(--border);
        }
        .docs-footer .heart { color: #9ca3af; }

        /* === Responsive === */
        @media (max-width: 1024px) {
            .docs-toc { display: none; }
            .docs-main { padding: 2rem 1.5rem; }
        }
        @media (max-width: 768px) {
            .docs-sidebar {
                position: fixed; top: 72px; left: 0; width: 100%; height: auto;
                z-index: 999; transform: translateX(-100%);
                transition: transform 0.3s; border-right: none;
                border-bottom: 1px solid var(--border);
            }
            .docs-sidebar.open { transform: translateX(0); }
            .docs-wrapper { flex-direction: column; }
            .docs-main { padding: 1.5rem 1rem; }
            .docs-content .art-title { font-size: 1.6rem; }
            .navbar { padding: 0 1.5rem; }
            .navbar .nav-links {
                position: fixed; top: 72px; left: 0; right: 0;
                flex-direction: column; gap: 0;
                background: var(--nav-mobile-bg); backdrop-filter: blur(20px);
                border-bottom: 1px solid var(--border); padding: 1rem 0;
                transform: translateY(-110%); transition: transform 0.3s ease; overflow: hidden;
            }
            .navbar .nav-links.open { transform: translateY(0); }
            .navbar .nav-links li { width: 100%; text-align: center; padding: 0.8rem 0; }
            .navbar .hamburger { display: flex; }
            .mobile-sidebar-toggle {
                display: flex !important;
                align-items: center; gap: 0.5rem;
                padding: 0.5rem 1rem; margin: 0 1rem 1rem;
                background: var(--sidebar-active); border: 1px solid var(--border);
                border-radius: var(--radius-sm); color: var(--text);
                font-size: 0.85rem; cursor: pointer; font-weight: 600;
            }
        }
        .mobile-sidebar-toggle { display: none; }
        /* === 移动端导航优化 === */
        @media (max-width: 900px) {
            .navbar { height: 64px; padding: 0 1rem; }
            .navbar .nav-links { top: 64px; padding: 0.8rem 1rem 1.2rem; align-items: stretch; }
            .navbar .nav-links li { text-align: left; padding: 0.25rem 0; }
            .navbar .nav-links a,
            .navbar .nav-links .theme-toggle {
                display: flex; align-items: center; justify-content: flex-start;
                width: 100%; padding: 0.8rem 1rem; border-radius: 8px; font-size: 0.95rem;
            }
            .navbar .nav-links .theme-toggle { height: auto; }
            .navbar .nav-links .gh-btn {
                justify-content: center; margin: 0.25rem 0 0.5rem;
                padding: 0.7rem 1rem; border-radius: 8px;
            }
            .navbar .hamburger { display: flex; }
        }

    </style>
</head>

        // ==================== Render Functions ====================
        let currentArticleId = null;

        function renderSidebar() {
            const list = document.getElementById('articleList');
            list.innerHTML = articles.map(a => `
                <li><a href="#" data-id="${a.id}" class="${a.id === currentArticleId ? 'active' : ''}">
                    <span class="art-icon">${a.icon}</span> ${a.title}
                </a></li>
            `).join('');
        }

        function renderToc(sections) {
            const list = document.getElementById('tocList');
            list.innerHTML = sections.map(s => {
                let html = `<a href="#${s.id}" class="active">${s.h2}</a>`;
                if (s.h3s.length) {
                    html += s.h3s.map(h3 => `<a href="#${h3.id}" class="h3">${h3.title}</a>`).join('');
                }
                return html;
            }).join('');
        }

        function renderContent(article) {
            const container = document.getElementById('docsContent');
            container.innerHTML = `
                <h1 class="art-title">${article.icon} ${article.title}</h1>
                <p class="art-desc">${article.desc}</p>
                ${contentTemplates[article.id] || '<p>内容加载中...</p>'}
            `;
        }

        function switchArticle(id) {
            const article = articles.find(a => a.id === id);
            if (!article) return;
            currentArticleId = id;
            renderSidebar();
            renderContent(article);
            renderToc(article.sections);
            // Close mobile sidebar
            document.getElementById('docsSidebar').classList.remove('open');
            // Highlight TOC on scroll
            document.querySelectorAll('.docs-content h2, .docs-content h3').forEach(el => {
                el.removeAttribute('data-toc-id');
            });
        }

        // ==================== Init ====================
        document.addEventListener('DOMContentLoaded', () => {
            // Theme
            const themeToggle = document.getElementById('themeToggle');
            const htmlEl = document.documentElement;
            const savedTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light');
            htmlEl.setAttribute('data-theme', savedTheme);
            themeToggle.textContent = savedTheme === 'dark' ? '暗' : '亮';
            themeToggle.addEventListener('click', () => {
                const next = htmlEl.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
                htmlEl.setAttribute('data-theme', next);
                localStorage.setItem('theme', next);
                themeToggle.textContent = next === 'dark' ? '暗' : '亮';
            });

            // Sidebar click
            document.getElementById('articleList').addEventListener('click', e => {
                const link = e.target.closest('a');
                if (link) { e.preventDefault(); switchArticle(link.dataset.id); }
            });

            // Mobile sidebar toggle
            const sidebarToggle = document.getElementById('mobileSidebarToggle');
            if (sidebarToggle) {
                sidebarToggle.addEventListener('click', () => {
                    document.getElementById('docsSidebar').classList.toggle('open');
                });
            }

            // Hamburger
            const hamburger = document.getElementById('hamburger');
            const navLinks = document.getElementById('navLinks');
            hamburger.addEventListener('click', () => {
                hamburger.classList.toggle('active');
                navLinks.classList.toggle('open');
            });
            navLinks.querySelectorAll('a').forEach(a => {
                a.addEventListener('click', () => {
                    hamburger.classList.remove('active');
                    navLinks.classList.remove('open');
                });
            });

            // Nav scroll
            window.addEventListener('scroll', () => {
                document.getElementById('navbar').classList.toggle('scrolled', window.scrollY > 50);
            });

            // TOC scroll spy
            const tocLinks = document.querySelectorAll('.toc-list a');
            const observer = new IntersectionObserver(entries => {
                entries.forEach(e => {
                    if (e.isIntersecting) {
                        tocLinks.forEach(l => l.classList.remove('active'));
                        const link = document.querySelector(`.toc-list a[href="#${e.target.id}"]`);
                        if (link) link.classList.add('active');
                    }
                });
            }, { rootMargin: '-80px 0px -60% 0px' });
            document.querySelectorAll('.docs-content h2, .docs-content h3').forEach(el => observer.observe(el));

            // Load first article
            switchArticle('quickstart');

            // URL hash support
            if (location.hash) {
                const id = location.hash.slice(1);
                if (articles.some(a => a.id === id)) switchArticle(id);
            }
        });
    </script>
