:root,[data-theme="dark"]{--primary:#9ca3af;--primary-dark:#6b7280;--primary-light:#d1d5db;--bg:#0d1117;--bg-light:#161b22;--card-bg:rgba(22,27,34,0.7);--card-border:rgba(255,255,255,0.1);--text:#e6edf3;--text-light:#8b949e;--text-muted:#6e7681;--border:rgba(255,255,255,0.08);--success:#10b981;--radius:16px;--radius-sm:8px;--shadow:0 4px 20px rgba(0,0,0,0.3);--shadow-lg:0 15px 40px rgba(255,255,255,0.06);--glow:0 0 30px rgba(255,255,255,0.12);--nav-bg:rgba(10,10,10,0.85);--nav-bg-scrolled:rgba(10,10,10,0.96);--nav-mobile-bg:rgba(10,10,10,0.97);--nav-shadow:0 4px 30px rgba(0,0,0,0.4);--nav-text:white;--nav-link-hover:white;--scrollbar-thumb:rgba(255,255,255,0.2);--scrollbar-thumb-hover:rgba(255,255,255,0.35);--surface-subtle:rgba(255,255,255,0.05);--surface-subtle-hover:rgba(255,255,255,0.1);--input-bg:rgba(255,255,255,0.05);--input-text:white;}
[data-theme="light"]{--primary:#9ca3af;--primary-dark:#6b7280;--primary-light:#d1d5db;--bg:#eaecf0;--bg-light:#f0f0f2;--card-bg:rgba(255,255,255,0.9);--card-border:rgba(0,0,0,0.1);--text:#1a1a1a;--text-light:#444444;--text-muted:#888888;--border:rgba(0,0,0,0.08);--success:#10b981;--radius:16px;--radius-sm:8px;--shadow:0 4px 20px rgba(0,0,0,0.08);--shadow-lg:0 15px 40px rgba(255,255,255,0.1);--glow:0 0 30px rgba(200,200,200,0.2);--nav-bg:rgba(255,255,255,0.92);--nav-bg-scrolled:rgba(255,255,255,0.98);--nav-mobile-bg:rgba(255,255,255,0.98);--nav-shadow:0 4px 30px rgba(0,0,0,0.08);--nav-text:#333333;--nav-link-hover:#000000;--scrollbar-thumb:rgba(255,255,255,0.25);--scrollbar-thumb-hover:rgba(255,255,255,0.4);--surface-subtle:rgba(0,0,0,0.04);--surface-subtle-hover:rgba(0,0,0,0.08);--input-bg:rgba(255,255,255,0.9);--input-text:#1a1a1a;}
*{margin:0;padding:0;box-sizing:border-box}html{scroll-behavior:smooth}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.7;overflow-x:hidden}.content-overlay{position:relative;z-index:1}::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--scrollbar-thumb);border-radius:3px}::-webkit-scrollbar-thumb:hover{background:var(--scrollbar-thumb-hover)}.navbar{position:sticky;top:0;z-index:1000;background:var(--nav-bg);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:0 3rem;height:72px;display:flex;align-items:center;justify-content:space-between;transition:background .3s,box-shadow .3s}.navbar.scrolled{background:var(--nav-bg-scrolled);box-shadow:var(--nav-shadow)}.navbar .logo{display:flex;align-items:center;gap:.6rem;font-size:1.4rem;font-weight:800;color:var(--nav-text);letter-spacing:-.5px;text-decoration:none}.navbar .logo .logo-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--primary),#9ca3af);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;font-weight:700;color:#fff}.navbar .nav-links{display:flex;gap:2.5rem;list-style:none;align-items:center}.navbar .nav-links a{text-decoration:none;color:var(--text-light);font-weight:500;font-size:.9rem;transition:color .2s;position:relative}.navbar .nav-links a::after{content:"";position:absolute;bottom:-4px;left:0;width:0;height:2px;background:var(--primary);transition:width .3s}.navbar .nav-links a:hover{color:var(--nav-link-hover)}.navbar .nav-links a:hover::after{width:100%}.navbar .nav-links a.active{color:var(--nav-link-hover)}.navbar .nav-links a.active::after{width:100%}.navbar .hamburger{display:none;flex-direction:column;gap:5px;background:none;border:none;cursor:pointer;padding:4px}.navbar .hamburger span{width:24px;height:2px;background:#fff;border-radius:2px;transition:all .3s}.navbar .hamburger.active span:nth-child(1){transform:rotate(45deg) translate(5px,5px)}.navbar .hamburger.active span:nth-child(2){opacity:0}.navbar .hamburger.active span:nth-child(3){transform:rotate(-45deg) translate(5px,-5px)}.theme-toggle{background:none;border:none;font-size:1.3rem;cursor:pointer;padding:.3rem;line-height:1;border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;transition:all .3s;color:var(--text-light)}.theme-toggle:hover{background:rgba(255,255,255,0.15);color:var(--primary-light)}.nav-links .gh-btn{background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);color:var(--primary-light);padding:.4rem 1rem;border-radius:20px;font-size:.85rem;font-weight:600;transition:all .2s}.nav-links .gh-btn:hover{background:rgba(255,255,255,0.25);border-color:var(--primary);color:var(--nav-link-hover)}.nav-links .gh-btn::after{display:none}@media(max-width:900px){.navbar{padding:0 1.5rem}.navbar .nav-links{position:fixed;top:72px;left:0;right:0;flex-direction:column;gap:0;background:var(--nav-mobile-bg);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:1rem 0;transform:translateY(-110%);transition:transform .3s ease;overflow:hidden}.navbar .nav-links.open{transform:translateY(0)}.navbar .nav-links li{width:100%;text-align:center;padding:.8rem 0}.navbar .hamburger{display:flex}}.container{max-width:1100px;margin:0 auto;padding:3rem 2rem}.section-title{text-align:center;font-size:2.2rem;font-weight:800;margin-bottom:.8rem;letter-spacing:-.5px;background:linear-gradient(135deg,#9ca3af 0%,#6b7280 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}.section-subtitle{text-align:center;color:var(--text-muted);font-size:1.05rem;max-width:600px;margin:0 auto 3rem}.section-divider{width:60px;height:3px;background:linear-gradient(90deg,var(--primary),#9ca3af);border-radius:3px;margin:1rem auto 2rem}.page-hero{text-align:center;padding:5rem 0 2rem}.page-hero h1{font-size:3.5rem;font-weight:900;letter-spacing:-2px;line-height:1.1;background:linear-gradient(135deg,#6b7280 0%,#d1d5db 30%,#9ca3af 70%,#d1d5db 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}.page-hero p{font-size:1.1rem;color:var(--text-light);max-width:650px;margin:1rem auto 0}.articles-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:1.5rem;margin:2rem 0}.article-card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius);overflow:hidden;backdrop-filter:blur(10px);transition:all .3s ease;cursor:pointer}.article-card:hover{transform:translateY(-5px);border-color:rgba(255,255,255,0.4);box-shadow:0 10px 40px rgba(255,255,255,0.1)}.article-card .card-img{height:180px;background:linear-gradient(135deg,var(--primary),#9ca3af);display:flex;align-items:center;justify-content:center;font-size:3rem}.article-card .card-body{padding:1.5rem}.article-card .card-tag{display:inline-block;font-size:.7rem;font-weight:600;padding:.15rem .6rem;border-radius:12px;background:rgba(255,255,255,0.1);color:var(--primary-light);border:1px solid rgba(255,255,255,0.2);margin-bottom:.6rem}.article-card h3{font-size:1.15rem;color:var(--text);font-weight:700;margin-bottom:.4rem}.article-card p{color:var(--text-light);font-size:.88rem;line-height:1.6;margin-bottom:.6rem}.article-card .meta{font-size:.78rem;color:var(--text-muted);display:flex;gap:1rem}.fade-in{opacity:0;transform:translateY(30px);transition:opacity .8s ease,transform .8s ease}.fade-in.visible{opacity:1;transform:translateY(0)}.footer{text-align:center;padding:3rem 2rem;color:var(--text-muted);font-size:.85rem;border-top:1px solid var(--border);margin-top:3rem}.footer .heart{color:#9ca3af}.footer .footer-links{display:flex;justify-content:center;gap:2rem;margin-bottom:1rem}.footer .footer-links a{color:var(--text-muted);text-decoration:none;font-size:.8rem;transition:color .2s}.footer .footer-links a:hover{color:var(--primary-light)}.back-to-top{position:fixed;bottom:2rem;right:2rem;width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--primary),#6b7280);color:#fff;border:none;font-size:1.2rem;cursor:pointer;z-index:999;box-shadow:0 4px 15px rgba(255,255,255,0.3);transition:all .3s;opacity:0;transform:translateY(20px);pointer-events:none}.back-to-top.show{opacity:1;transform:translateY(0);pointer-events:auto}.back-to-top:hover{transform:translateY(-3px);box-shadow:0 6px 25px rgba(255,255,255,0.5)}@media(max-width:768px){.page-hero h1{font-size:2.2rem}.container{padding:2rem 1.2rem}.section-title{font-size:1.8rem}.articles-grid{grid-template-columns:1fr}}@media(max-width:480px){.page-hero h1{font-size:1.8rem}.container{padding:1.5rem 1rem}}</style>

itle:"自研 Agent 引擎的设计哲学",desc:"为什么选择零框架依赖自研？从 Think-Act-Stream 循环到工具系统，本文深入剖析 agent-core 的架构设计。",date:"2025-01-10",icon:""},{tag:"教程",title:"快速开始: 5 分钟上手 CodeDash",desc:"从安装到第一次 AI 对话，5 分钟完成。支持 Plan/Agent/Chain 三种模式，满足不同场景需求。",date:"2025-01-08",icon:""},{tag:"技术分享",title:"BM25 + 向量搜索: 双层召回架构",desc:"CodeDash 的代码搜索结合传统 BM25 精确匹配和 bge-small-zh 语义嵌入，通过 RRF 融合排序提供最佳结果。",date:"2025-01-05",icon:""},{tag:"产品更新",title:"浏览器自动化: 12+ 操作工具详解",desc:"内置 headless Chromium，支持导航、点击、输入、滚动、截图等 12 种浏览器操作，AI 像人类一样操作网页。",date:"2024-12-28",icon:""},{tag:"教程",title:"计算机控制: AI 操控桌面的安全边界",desc:"基于 nut.js 的桌面自动化能力，如何配置安全策略确保 AI 操作在可控范围内执行。",date:"2024-12-20",icon:""}]function renderArticles(){const g=document.getElementById("articlesGrid");g.innerHTML=articles.map(a=>'<div class="article-card fade-in"><div class="card-img">'+a.icon+'</div><div class="card-body"><span class="card-tag">'+a.tag+'</span><h3>'+a.title+'</h3><p>'+a.desc+'</p><div class="meta"><span>'+a.date+'</span></div></div></div>').join("")}document.addEventListener("DOMContentLoaded",()=>{renderArticles();const t=document.getElementById("themeToggle"),e=document.documentElement,d=localStorage.getItem("theme"),s=window.matchMedia("(prefers-color-scheme: dark)").matches;d?e.setAttribute("data-theme",d):e.setAttribute("data-theme",s?"dark":"light"),t.textContent="dark"===e.getAttribute("data-theme")?"暗":"亮",t&&t.addEventListener("click",()=>{const n="dark"===e.getAttribute("data-theme")?"light":"dark";e.setAttribute("data-theme",n),localStorage.setItem("theme",n),t.textContent="dark"===n?"暗":"亮"});const h=document.getElementById("hamburger"),n=document.getElementById("navLinks");h&&h.addEventListener("click",()=>{h.classList.toggle("active"),n.classList.toggle("open")}),n&&n.querySelectorAll("a").forEach(a=>{a.addEventListener("click",()=>{h.classList.remove("active"),n.classList.remove("open")})}),window.addEventListener("scroll",()=>{document.getElementById("navbar").classList.toggle("scrolled",window.scrollY>50),document.getElementById("backToTop").classList.toggle("show",window.scrollY>300)}),document.getElementById("backToTop").addEventListener("click",()=>window.scrollTo({top:0,behavior:"smooth"}));const o=new IntersectionObserver(e=>{e.forEach(e=>{e.isIntersecting&&e.target.classList.add("visible")})},{threshold:.1});document.querySelectorAll(".fade-in").forEach(e=>o.observe(e))});</script>
