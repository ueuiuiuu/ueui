site_name: Ueui Profile
site_url: https://ueuiuiuu.github.io/ueui
theme:
  name: material
  language: zh
  logo: assets/ueui-logo.svg
  favicon: market/codedash/icon-codedash.svg
  palette:
    - scheme: slate
      primary: black
      accent: black
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式
    - scheme: default
      primary: black
      accent: black
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式

extra_css:
  - assets/css/ueui-theme.css
  - assets/css/ueui-home.css

extra_javascript:
  - assets/js/mobile-toc.js
  - assets/js/prev-next.js
  - assets/js/water-grid.js
  - assets/js/theme-reveal.js
  - assets/js/home-reveal.js
  - assets/js/qa-scroll.js

# 👇 左侧菜单栏（你可以自由增删）
nav:
  - 首页: index.md
  - 关于: deploy-guide.md
  - 集市:
      - 工具: market/tools/index.html
      - 官网: market/codedash/index.html
      - 存档: market/recalltry.md
      - 白板: market/whiteboard/index.html
  - 文章:
    - 学习日志:
        - 智能体消息缓冲机制: txt11.md
        - 抢单接口压测过程: txt1.md
        - 以目标为导向: txt2.md
        - 前端部署记录: txt3.md
        - 压缩Java内存: txt4.md
        - 传播App经验: txt5.md
        - 粗浅理解深度学习: txt6.md
    - 回顾近两年来的历程: txt12.md
  - 算法:
      - 自制Skill进行代码转化的情况: txt10.md
      - 像写Java一样写C++: txt7.md
      - 像写Java/cpp一样写 Python: txt8.md
      - 像写Python一样写Go: txt9.md





markdown_extensions:
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
